<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <style>
      body {
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        background-color: #e8f5e9;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background-color: #ffffff;
        width: 300px;
        padding: 30px;
        border-radius: 8px;
      }

      h2 {
        color: #1b5e20;
        text-align: center;
        margin-bottom: 50px;
        font-size: 30px;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      input {
        padding: 10px;
        margin-bottom: 20px;
        border: 2px solid #a5d6a7;
        border-radius: 8px;
      }

      input::placeholder {
        color: #1b5e20;
        opacity: 60%;
      }

      input:focus {
        outline: none;
        background-color: #a5d6a76b;
      }

      button {
        padding: 10px;
        border: none;
        color: #ffffff;
        font-weight: 700;
        border-radius: 8px;
        background-color: #a5d6a7;
      }

      button:hover {
        cursor: pointer;
        background-color: #94d496;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Login</h2>
      <form>
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button>Login</button>
      </form>
    </div>
  </body>
</html>
