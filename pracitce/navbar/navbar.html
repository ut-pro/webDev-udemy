<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Bar Variations</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        height: 150vh;
        color: #ffff;
        box-sizing: border-box;
        background-color: #1a1a1a;
        font-family: Arial, Helvetica, sans-serif;
      }

      .nav-container {
        padding: 30px;
      }

      .nav1 {
        margin: 20px;
        background-color: #1f2d3d;
      }

      .nav1 ul {
        padding: 20px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        list-style-type: none;
      }

      .nav1 li {
        display: inline;
      }

      .nav1 a {
        padding: 5px;
        color: #fbbf24;
        text-decoration: none;
        position: relative;
      }

      .nav1 a::after {
        content: "";
        height: 2px;
        width: 100%;
        position: absolute;
        left: 0;
        bottom: 0;
        background-color: #fbbf24;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s ease-in-out;
      }

      .nav1 a:hover::after {
        transform: scaleX(1);
      }

      .nav1 .login-btn {
        color: #fbbf24;
        font-weight: 700;
        padding: 8px 20px;
        background-color: transparent;
        border: 2px solid #fbbf24;
        border-radius: 5px;
        transition: background-color 0.5s ease-in-out;
      }

      .nav1 .login-btn:hover {
        cursor: pointer;
        color: #1f2d3d;
        background-color: #fbbf24;
      }

      .nav2 {
        width: 150px;
        height: 500px;
        margin: 20px;
        padding: 20px;
        background-color: #2d1f3d;
      }

      .nav2 ul {
        margin: 0;
        padding: 0;
        list-style-type: none;
      }

      .nav2 li {
        padding: 10px;
        margin-bottom: 10px;
      }

      .nav2 a {
        color: #fdf4ff;
        text-decoration: none;
        position: relative;
        transition: padding-left 0.3s ease-in-out;
      }

      .nav2 a::before {
        content: "→ ";
        position: absolute;
        left: 0;
        display: inline-block;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s ease-in-out;
      }

      .nav2 a:hover {
        padding-left: 20px;
      }

      .nav2 a:hover::before {
        transform: scaleX(1);
      }

      .nav2 .login-btn {
        width: 100%;
        margin-top: 10px;
        color: #111827;
        padding: 8px 16px;
        font-weight: 700;
        border: none;
        background-color: #34d399;
        transition: background-color 0.3s ease-in-out;
      }

      .nav2 .login-btn:hover {
        cursor: pointer;
        background-color: #059669;
      }

      .nav3 {
        margin: 20px;
        padding: 20px;
        background-color: #1f3d2d;
      }

      .nav3 ul {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
        list-style-type: none;
      }

      .nav3 li {
        position: relative;
      }

      .nav3 a {
        padding-bottom: 5px;
        color: #f0fdf4;
        text-decoration: none;
        transition: font-size 0.3s ease-in-out;
        position: relative;
      }

      .nav3 a::after {
        content: "";
        height: 2px;
        width: 110%;
        position: absolute;
        left: 0;
        bottom: 0;
        background-color: #fde047;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s ease-in-out;
      }

      .nav3 a:hover {
        font-size: 18px;
      }

      .nav3 a:hover::after {
        transform: scaleX(1);
      }

      .nav3 .dropdown-content {
        display: none;
        padding: 15px 10px 10px;
        width: 100px;
        flex-direction: column;
        gap: 10px;
        top: 100%;
        left: 0;
        position: absolute;
        background-color: #2d5a43;
        border-top: 15px solid transparent;
        background-clip: padding-box;
      }

      .nav3 .dropdown:hover .dropdown-content {
        display: flex;
      }

      .nav3 .dropdown-content a {
        width: max-content;
        font-size: 14px;
      }

      .nav3 .dropdown-content a:hover {
        font-size: 16px;
      }

      .nav3 .login-btn {
        padding: 8px 16px;
        font-weight: 700;
        color: #fde047;
        background-color: transparent;
        border: 2px solid #fde047;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
      }

      .nav3 .login-btn:hover {
        cursor: pointer;
        color: #14532d;
        background-color: #fde047;
      }
    </style>
  </head>
  <body>
    <div class="nav-container">
      <h2>Variation 1: Horizontal with underline effect</h2>
      <nav class="nav1">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>

    <div class="nav-container">
      <h2>Variation 2: Vertical with hover effect</h2>
      <nav class="nav2">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
        </ul>
        <button class="login-btn">Login</button>
      </nav>
    </div>

    <div class="nav-container">
      <h2>Variation 3: Horizontal with dropdown</h2>
      <nav class="nav3">
        <ul>
          <li><a href="#">Home</a></li>
          <li class="dropdown">
            <a href="#">About</a>
            <div class="dropdown-content">
              <a href="#">Our Story</a>
              <a href="#">Team</a>
              <a href="#">Contact</a>
            </div>
          </li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>
  </body>
</html>
